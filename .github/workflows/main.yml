name: Build Sely Guardian APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Locate project (zip or repo root)
        run: |
          ZIP=$(ls SelyGuardian*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ]; then
            rm -rf proj && mkdir proj && unzip -q "$ZIP" -d proj
            echo "DIR=proj" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi
      - name: Build debug APK
        run: cd "$DIR" && gradle assembleDebug --no-daemon --stacktrace
      - name: Run unit tests
        run: cd "$DIR" && gradle testDebugUnitTest --no-daemon
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: SelyGuardian-debug
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
